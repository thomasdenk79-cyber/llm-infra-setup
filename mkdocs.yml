site_name: LLM Infrastructure Setup
site_description: Reproducible local Qwen infrastructure on CachyOS
site_url: https://example.invalid/llm-infra-setup
theme:
  name: material
  language: de
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - toc.integrate
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
nav:
  - Start: index.md
  - Architektur: architecture.md
  - Installation: install.md
  - Betrieb: operations.md
  - Geschwindigkeit: performance.md
  - Beobachtung: monitoring.md
  - Sicherheit: security.md
  - Sicherung und Rueckgabe: backup-restore.md
  - Fehlerbilder: troubleshooting.md
  - Status: status.md
  - Pflichtabgleich: COMPLIANCE.md
  - Entscheidungen:
      - Rootless Podman: adr/0001-use-rootless-podman.md
      - Pennyroyal: adr/0002-use-pennyroyal.md
      - LiteLLM: adr/0003-use-litellm.md
      - Quadlet: adr/0004-use-quadlet.md
      - Komodo: adr/0005-use-komodo.md
      - Modellager: adr/0006-separate-model-storage.md
      - Beobachtungsstapel: adr/0007-observability-stack.md
      - MkDocs: adr/0008-use-mkdocs.md
      - Netze und Metrikabruf: adr/0009-scrape-across-networks.md
      - Host-Kennzahlen: adr/0010-host-metrics-im-container-statt-nativ.md
      - PLE-Flaeche: adr/0011-ple-ext4-loop-statt-zfs.md
      - Uebergabe: HANDOFF.md
      - Schreibrate-Grenze: adr/0012-grenze-der-schreibrate-liegt-nicht-an-thunderbolt.md
      - Exklusive GPU: adr/0013-grundregel-exklusive-grafikkarte.md
  - Varianten:
      - Vergleich: variant-comparison.md
      - Upstream-PLE (A): turbo-upstream-ple.md
      - Variante A: variants/variant-a-upstream-ple-graph.md
  - English:
      - Overview: en/index.md
      - Operations: en/operations.md
