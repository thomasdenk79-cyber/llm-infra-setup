# Prometheus-Konfiguration. Alle Targets sind Container-Namen im respective
# Netz von Prometheus; Host-Kennzahlen kommen über den node_exporter-Container.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: llm-infra

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["llm-node-exporter:9100"]
        labels: { host: llm-host }

  - job_name: gpu
    static_configs:
      - targets: ["llm-gpu-exporter:9835"]
        labels: { gpu: rtx-pro-6000 }

  - job_name: pennyroyal
    metrics_path: /metrics
    static_configs:
      - targets: ["pennyroyal:8001"]
        labels: { service: inference }

  # Gateway-Liveliness: /health/liveliness ist der einzige keyless Endpunkt des
  # Gateways. /health und /metrics sind master-key-geschuetzt; ein Scrape ohne
  # Authorization ueberschwemmt das Journal mit 401 plus Python-Tracebacks
  # ("No api key passed in." / "Malformed API Key... Bearer prefix"). Wer den
  # Gateway als Prometheus-Target anlegt, nutzt ausschliesslich diesen Pfad.
  # (Derzeit nicht scharf: der Node-Collector liefert llm_unit_active{unit=
  # "litellm"} bereits als Up/Down-Ersatz - siehe config/monitoring/alerts.yml.)
  #
  # - job_name: litellm-liveliness
  #   metrics_path: /health/liveliness
  #   static_configs:
  #     - targets: ["litellm:4000"]
  #       labels: { service: gateway }

  # Gateway-Metriken sind vorbereitet, aber der offizielle LiteLLM-Container
  # (Chainguard-Image) enthaelt kein prometheus-client; /metrics liefert dort 404
  # und zusaetzlich 401 ohne gueltigen Bearer (os.environ-Wert, nie als Klartext
  # ins YAML). Freischalten: eigenes Image mit prometheus-client bauen, dann
  # diesen Block auskommentieren und User=root im Prometheus-Quadlet setzen
  # (Begruendung: die Schluesseldatei gehoert dem Betreiber). Anleitung:
  # docs/monitoring.md
  #
  # - job_name: litellm
  #   metrics_path: /metrics
  #   authorization:
  #     type: Bearer
  #     credentials_file: /etc/prometheus/secrets/litellm-token
  #   static_configs:
  #     - targets: ["litellm:4000"]
  #       labels: { service: gateway }

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels: { service: logs }
