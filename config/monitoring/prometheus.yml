# Prometheus-Konfiguration. Alle Targets sind Container-Namen im respective
# Netz von Prometheus; Host-Kennzahlen kommen über den node_exporter-Container.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: llm-infra

rule_files:
  - /etc/prometheus/conf/alerts.yml
  - /etc/prometheus/conf/runtime-compat.yml

# Alarme laufen zum Alertmanager dieses Stapels. Ohne diesen Abschnitt werden
# die Regeln in alerts.yml zwar ausgewertet, aber nirgends hingegeben - ein
# defekter Alarm, der nie laut wird. Kanal und Beispiel siehe
# config/monitoring/alertmanager.yml.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["llm-node-exporter:9100"]
        labels: { host: llm-host }

  - job_name: gpu
    static_configs:
      - targets: ["llm-gpu-exporter:9835"]
        labels: { gpu: rtx-pro-6000 }

  # Pennyroyal ist auf diesem Rechner nicht im Einsatz: die Inferenz-Laufzeit
  # ist vLLM (job "vllm" unten). Der Block bleibt fuer Rechner mit Pennyroyal
  # erhalten und wird dort wieder ausgkommentiert; als totes Target wurde er
  # sonst dauerhaft als Alarm schlagen.
  #
  # - job_name: pennyroyal
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["pennyroyal:8001"]
  #       labels: { service: inference }

  # Gateway-Liveliness: /health/liveliness ist der einzige keyless Endpunkt des
  # Gateways, antwortet aber mit application/json - Prometheus kann daraus keine
  # Messgroessen bilden (Fehler: unsupported Content-Type). /metrics liefert
  # dieser LiteLLM-Bau 404, weil das Image kein prometheus-client enthaelt; mit
  # gueltigem Schluessel 404, ohne Schluessel 401. Eine Sonde ueber JSON waere
  # ein eigener Exporter (blackbox_exporter) - bewusst nicht aufgenommen.
  # Die Gateway-Laufzeit wird ueber llm_unit_active{unit="litellm"} ueberwacht
  # (siehe scripts/collect-host-facts.sh und config/monitoring/alerts.yml).
  #
  # - job_name: litellm-liveliness
  #   metrics_path: /health/liveliness
  #   static_configs:
  #     - targets: ["litellm:4000"]
  #       labels: { service: gateway }

  # Gateway-Metriken sind vorbereitet, aber der offizielle LiteLLM-Container
  # (Chainguard-Image) enthaelt kein prometheus-client; /metrics liefert dort 404
  # und zusaetzlich 401 ohne gueltigen Bearer (os.environ-Wert, nie als Klartext
  # ins YAML). Freischalten: eigenes Image mit prometheus-client bauen, dann
  # diesen Block auskommentieren und User=root im Prometheus-Quadlet setzen
  # (Begruendung: die Schluesseldatei gehoert dem Betreiber). Anleitung:
  # docs/monitoring.md
  #
  # - job_name: litellm
  #   metrics_path: /metrics
  #   authorization:
  #     type: Bearer
  #     credentials_file: /etc/prometheus/secrets/litellm-token
  #   static_configs:
  #     - targets: ["litellm:4000"]
  #       labels: { service: gateway }

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels: { service: logs }

  # Der Beobachtungsstapel ueberwacht sich selbst: faellt Grafana oder der
  # Protokollsammler weg, bleiben sonst nur die Panels still - kein Alarm.
  - job_name: grafana
    # Grafana liefert /metrics nur unter dem Unterpfad, weil 60-install-monitoring.sh
    # GF_SERVER_SERVE_FROM_SUB_PATH=true setzt (oeffentlicher Zugang ueber /grafana/).
    # Ohne diese Zeile antwortet /metrics nur mit 301 und der Target faellt auf down.
    metrics_path: /grafana/metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels: { service: dashboards }

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
        labels: { service: logcollector }

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels: { service: alerts }

  # Der LAN-Proxy ist ein eigener Dienst und bekommt deshalb ein eigenes
  # Metrikziel (Regel in AGENTS.md). Scrape gegen den Container-Namen: Prometheus
  # haengt in denselben Podman-Netzen wie llm-proxy, der Host-Loopback waere ihm
  # bei rootless Podman verschlossen. Der Port 8080 ist nicht veroeffentlicht.
  - job_name: caddy
    static_configs:
      - targets: ["llm-proxy:8080"]
        labels: { service: proxy }

  # LUNI-Delta (2026-11-17): inference runtime metrics, scraped directly on the
  # stable runtime port 30000 via the host gateway (AddHost=
  # host.containers.internal:host-gateway). Requires the runtime to bind
  # 0.0.0.0 (SGLang launcher does; ufw limits 30000 to the LAN). The job name
  # "vllm" is kept stable for dashboards/alerts regardless of runtime (vLLM or
  # SGLang); runtime-compat.yml maps sglang:* onto the vllm:* names.
  - job_name: vllm
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["host.containers.internal:30000"]
