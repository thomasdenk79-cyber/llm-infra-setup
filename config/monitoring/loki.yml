auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  filesystem:
    directory: /loki/chunks
limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  # Nachlaufende Kollektoren (Alloy-Neustart, Journal-Rueckstand bis max_age)
  # sonst verwirft Loki ihre Eintraege stillschweigend als 'entry too far
  # behind' - Praxisbefund der Review-Welle 2026-11-18.
  creation_grace_period: 2h
  # Compactor loescht nur mit gesetzter Periode; ohne diese Zeile waechst der
  # Bestand unbounded (retention_enabled ist an, Periode war 0s).
  retention_period: 30d
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
